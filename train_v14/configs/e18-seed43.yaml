# E18 — seed replicate of the winner (e2 recipe, seed 43): measures
# run-to-run variance so the ablation gaps (e.g. 0.559 vs 0.549) can be
# read against noise.
run_name: e18-seed43
model_id: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/models/Qwen3.8-27B
output_dir: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/e18-seed43
accel_config: accelerate_fsdp2_8gpu.yaml

use_lora: false
vision_strategy: frozen

# data
trace_mode: optional          # all samples; trace when gate-verified
trace_gate: pass_only
image_aug: true
system_prompt: detailed
reasoning_effort: medium
max_seq_len: 5120
min_pixels: 200704
max_pixels: 1179648

# optim
lr: 6.0e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

# batch: 2 x 8 ranks x acc4 = eff 64
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: false

# loop
max_steps: 2500
save_strategy: "no"       # best-only: EvalLossCallback saves on val/loss improvement
save_total_limit: 1
save_only_model: false   # FSDP SHARDED_STATE_DICT rejects model-only saves
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 43
