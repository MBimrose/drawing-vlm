# E57 - self-distilled reasoning tier for hard real parts (RECIPE "Self-distilled real-part
# tier"). Same recipe as e55 (0.4.23 sheets, data_version 2) with two changes:
#   * the RFT base is the re-packed rft_strict90_all_dw423b (153,567 rows, +787 recovered);
#   * the shelved ABC ground-truth-code tier is replaced by rft_selfdistill_* -- real parts
#     that e55 solves only at K=32, each row carrying the model's OWN think trace from the
#     draw that verified at IoU >= 0.8. e56 showed borrowed (base-model) reasoning memorises
#     and does not transfer; this tier tests whether the model's own reasoning does.
# Paths in sbatch/e57-rft-real-sd-dw423.sbatch (DRAWING_VLM_TARS, DRAWING_VLM_EVAL_CACHE_V15,
# DRAWING_VLM_RFT_SHARDS=rft_mix_u7_sd_dw423). Seed 43, as e55.
run_name: e57-rft-real-sd-dw423
model_id: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/models/Qwen3.8-27B
output_dir: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/e57-rft-real-sd-dw423
accel_config: accelerate_fsdp2_8gpu.yaml

use_lora: false
vision_strategy: frozen

data_version: 2
reasoning_frac: 0.2
rft_frac: 0.6
image_aug: true
exec_filter: true
system_prompt: detailed
reasoning_effort: medium
max_seq_len: 5120
min_pixels: 200704
max_pixels: 1179648

lr: 6.0e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: false

max_steps: 4000
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 43
