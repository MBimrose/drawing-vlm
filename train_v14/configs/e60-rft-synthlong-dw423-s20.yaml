# serv-20 variant (GPUs 4-7 only): 4 ranks x grad-accum 16 = the same 64-sample global batch as 8 x 8.
# E60 - long-program tier: e55's own >=0.9 solutions to synthetic GT programs with >=12 ops (synth_long,
# ~12k training sheets), ~25% of RFT draws on top of base dw423b + union5 x5. Tests whether the
# program-length ceiling that RFT imposes (median 6 ops) is what caps real/ABC parts (RECIPE 2026-09-22).
run_name: e60-rft-synthlong-dw423
model_id: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/models/Qwen3.8-27B
output_dir: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/e60-rft-synthlong-dw423
accel_config: accelerate_fsdp2_4gpu.yaml

use_lora: false
vision_strategy: frozen

data_version: 2
reasoning_frac: 0.2
rft_frac: 0.6
image_aug: true
exec_filter: true
system_prompt: detailed
reasoning_effort: medium
max_seq_len: 5120
min_pixels: 200704
max_pixels: 1179648

lr: 6.0e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: false

max_steps: 4000
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 43
