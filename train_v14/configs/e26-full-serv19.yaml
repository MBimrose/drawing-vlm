# E26-FULL — Qwen3.8-Flash-Next (180B-A6B MoE) FULL fine-tune on wpk-serv-19
# (8x B300 275 GB, no SLURM). Champion data recipe (60% verified RFT / 20%
# certified / 20% exec-filtered plain). Everything trains except the vision
# tower, the 102 GB frozen n-gram PLE table (mmap) and the unused MTP head.
# Memory/GPU: fp32 master 63 + fp32 grads 63 + torchao 8-bit AdamW 32 GB +
# activations -> ~210 GB of 275 GB.
run_name: e26-full-serv19
model_id: /srv/scratch/bimrose2/models/Qwen3.8-Flash-Next
output_dir: /srv/scratch/bimrose2/runs/e26-full-serv19
accel_config: accelerate_fsdp2_qwen4exp.yaml

use_lora: false
vision_strategy: frozen
demote_persistent_buffers: true
mmap_ngram_embedding: true
fast_qsa_indexer: true
optim: adamw_torch_8bit

data_version: 2
reasoning_frac: 0.2
rft_frac: 0.6
image_aug: true
exec_filter: true
dims_filter: false
system_prompt: detailed
trace_style: think
reasoning_effort: medium
max_seq_len: 5120
min_pixels: 200704
max_pixels: 1179648

lr: 6.0e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: false

max_steps: 3000
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 42
