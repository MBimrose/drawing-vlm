# FSDP2 full-shard, 4 ranks on serv-20 GPUs 4-7 (B300 275 GB) for Nemotron-3.5-Super-VL-120B-A12B (2026-10-15).
# Per rank: frozen routed experts bf16 ~57 GB, trained subset (~8.1B) fp32 master + AdamW + grads ~32 GB,
# one NemotronHBlock all-gathered at a time (an MoE block is ~5.6 GB bf16), activations with checkpointing.
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
num_machines: 1
num_processes: 4
machine_rank: 0
main_training_function: main
rdzv_backend: static
same_network: true
fsdp_config:
  fsdp_version: 2
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_offload_params: false
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_activation_checkpointing: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: NemotronHBlock,RadioLayer
  fsdp_cpu_ram_efficient_loading: false
  fsdp_use_orig_params: true
  fsdp_sync_module_states: true
  fsdp_reshard_after_forward: true
