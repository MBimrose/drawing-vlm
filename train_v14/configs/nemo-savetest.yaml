# SAVE TEST (2 ranks, GPUs 2-3): one step then a full gather-save (save_full_model) -> check keys with nemotron_finalize_ckpt.py
# OPTIMIZER CHECK arm B (2026-10-15, serv-19 GPUs 2-3): same config/seed/data, pure-bf16 params + bf16_sr_adamw
# (bf16 weights updated with stochastic rounding, bf16 grads, fp32 moments) = the optimizer the full FT needs.
# Nemotron-3.5-Super-VL-120B-A12B on the e55 recipe (2026-10-15). Data = e55 exactly (paths in serv-20
# nemotron/env_nemo.sh: tars_v14_dw423 plain tier, rft_mix_u6_gt_dw423 RFT tier, v14_bundle reasoning tier, 60/20/20,
# exec filter, system prompt detailed, seq 5120 [Nemotron rows: p99 3.7k tokens at native 1920x1280 = 2,400 image
# tokens, 0% truncated], cosine -> 10%, warmup 3%, effective batch 64 = 1 x 16 accum x 4 ranks).
# Differences forced by size: routed experts (112.7B) frozen with the vision tower; everything else (Mamba,
# attention, shared experts, router, latent projections, norms, embeddings, lm_head, vision projector; 8.1B) full FT.
# LR 5e-6: the recipe's 1/sqrt(params) rule from 27B@6e-6 gives 9e-6 by active (12B) and 2.8e-6 by total (121B)
# params; 5e-6 is their geometric mean.
run_name: nemo-savetest
model_id: /srv/scratch/bimrose2/models/Nemotron-3.5-Super-VL-120B-A12B-BF16
output_dir: /srv/scratch/bimrose2/nemotron/runs/nemo-savetest
accel_config: accelerate_fsdp2_2gpu_nemotron_purebf16.yaml
trust_remote_code: true
experts_implementation: {llm_config: grouped_mm}
# the remote top-level class declares no SDPA support (it has no attention itself); its LLM and RADIO sub-models do
attn_implementation: {"": eager, llm_config: sdpa, vision_config: sdpa}
freeze_routed_experts: true
demote_persistent_buffers: true

use_lora: false
vision_strategy: frozen

data_version: 2
reasoning_frac: 0.2
rft_frac: 0.6
image_aug: true
exec_filter: true
system_prompt: detailed
reasoning_effort: medium
max_seq_len: 5120

lr: 5.0e-6
lr_scheduler_type: constant_with_warmup
lr_scheduler_kwargs: {}
warmup_ratio: 0.1
weight_decay: 0.0
optim: bf16_sr_adamw
bf16: false

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
gradient_checkpointing: false
sync_each_batch: true

max_steps: 1
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
best_save_mode: gather
save_final: false
logging_steps: 1
eval_every: 1
eval_n: 128
eval_n_batches: 1
dataloader_num_workers: 4
dataloader_prefetch_factor: 4
seed: 43
router_monitor_every: 0
router_stop_ratio: 0
