# E11 — input-resolution axis: 2x the image token budget (max_pixels 2.36M
# vs 1.18M) so dimension text renders sharper; longer seq to fit it.
run_name: e11-lora-hires
model_id: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/models/Qwen3.8-27B
output_dir: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/e11-lora-hires
accel_config: accelerate_ddp_4gpu.yaml

use_lora: true
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: auto
vision_strategy: frozen

trace_mode: required
trace_gate: pass_only
image_aug: false
system_prompt: detailed
reasoning_effort: medium
max_seq_len: 6144
min_pixels: 200704
max_pixels: 2359296

lr: 1.0e-4
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true

max_steps: 2500
save_strategy: "no"
save_total_limit: 1
save_only_model: true
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 42
