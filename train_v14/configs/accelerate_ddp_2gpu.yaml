# DDP for LoRA runs on 2 GPUs (cycle 2 SFT on serv-20 B300s, 2026-10-09).
# train, so no sharding needed. 4 processes -> two LoRA jobs share one node.
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
mixed_precision: bf16
num_machines: 1
num_processes: 2
machine_rank: 0
main_training_function: main
rdzv_backend: static
same_network: true
