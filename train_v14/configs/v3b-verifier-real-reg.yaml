# V3B-VERIFIER-REAL-REG — regression variant of v3-verifier-real: same real-part
# pool, same LoRA/optim, but the v1 target (predicted IoU as text, "0.73")
# instead of yes/no at 0.85. Motivation: v3 (binary) at step 250 is already a
# good classifier on the 146 held-out parts (AUROC 0.94 at iou>=0.8) but a
# weak ranker among the wrong candidates (per-part Spearman 0.2-0.27), which
# is what mean IoU needs on real parts (70% of parts have no candidate >=0.85).
# v1 collapsed on a positives-heavy synthetic pool; this pool is 93% negative
# with a continuous IoU spread.
run_name: v3b-verifier-real-reg
model_id: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/e51-rft-real-u3-strict90/final
output_dir: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/v3b-verifier-real-reg
accel_config: accelerate_fsdp2_8gpu.yaml

use_lora: true
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: auto
vision_strategy: frozen

data_version: 3
image_aug: true
system_prompt: detailed
trace_style: think
reasoning_effort: medium
max_seq_len: 4096
min_pixels: 200704
max_pixels: 1179648

lr: 1.0e-4
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
gradient_checkpointing: false

max_steps: 2500
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 256
eval_n_batches: 32
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 42
