# FSDP2 full-shard for Muse-Glimmer-30B on 4 GPUs (2026-10-28: the LoRA row, serv-05 GPUs 4-7; copy of the 8-GPU file):
# accelerate_fsdp2_8gpu.yaml (the 27B e55 run) with this model's decoder / vision layer classes.
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
num_machines: 1
num_processes: 4
machine_rank: 0
main_training_function: main
rdzv_backend: static
same_network: true
fsdp_config:
  fsdp_version: 2
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_offload_params: false
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_activation_checkpointing: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: MuseGlimmerTextDecoderLayer,MuseGlimmerVisionEncoderLayer
  fsdp_cpu_ram_efficient_loading: true   # rank 0 loads, others get lazy placeholders: 8 x ~125 GB host copies would fill serv-05 (1 TB)
  fsdp_use_orig_params: true
  fsdp_sync_module_states: true
  fsdp_reshard_after_forward: true
