# E32 — Flash-Next FULL FT round 2 (STaR iteration on serv-19): continue from
# e26-full-serv19/final on RFT-4 = samples generated by that model itself
# (4 candidates/part, iou>=0.8; DRAWING_VLM_RFT_SHARDS -> rft_v4/shards),
# 70% RFT / 20% certified / 10% plain, half LR, 1500 steps.
output_dir: /srv/scratch/bimrose2/runs/e32-full-serv19-r2
accel_config: accelerate_fsdp2_qwen4exp_purebf16.yaml
run_name: e32-full-serv19-r2
model_id: /srv/scratch/bimrose2/runs/e26-full-serv19/final

use_lora: false
vision_strategy: frozen
demote_persistent_buffers: true
mmap_ngram_embedding: true
fast_qsa_indexer: true
optim: bf16_sr_adamw          # fp32 Adam states + bf16 params w/ stochastic rounding (bf16_sr_adamw.py)
bf16: false
sync_each_batch: true        # reduce-scatter grads every micro-batch (no_sync would hold 252 GB unsharded)

data_version: 2
reasoning_frac: 0.2
rft_frac: 0.7
image_aug: true
exec_filter: true
dims_filter: false
system_prompt: detailed
trace_style: think
reasoning_effort: medium
max_seq_len: 5120
min_pixels: 200704
max_pixels: 1179648

lr: 3.0e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: false

max_steps: 1500
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
best_save_mode: gather      # best = gathered bf16 HF dir (runs/<run>/best_model), not a 1.2 TB DCP dump
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 42
