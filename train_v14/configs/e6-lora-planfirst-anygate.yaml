# E6 — quantity-vs-quality + prompt variant: ALL traces (including unverified
# / gate-failed) with the plan_first system prompt and a lower LR.
# Node ccc0475 (4 GPUs), DDP — queues behind e3/e4.
run_name: e6-lora-planfirst-anygate
model_id: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/models/Qwen3.8-27B
output_dir: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/e6-lora-planfirst-anygate
accel_config: accelerate_ddp_4gpu.yaml

use_lora: true
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: auto
vision_strategy: frozen

# data
trace_mode: required
trace_gate: any          # every non-empty trace, verified or not
image_aug: false
system_prompt: plan_first
reasoning_effort: medium
max_seq_len: 5120
min_pixels: 200704
max_pixels: 1179648

# optim
lr: 5.0e-5
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true

max_steps: 2500
save_strategy: "no"       # best-only: EvalLossCallback saves on val/loss improvement
save_total_limit: 1
save_only_model: true
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 42
