# E29 — STaR iteration: CONTINUE from e28 final (0.837 @ckpt-4500) on the same
# 60% RFT / 20% certified / 20% plain mix at half LR. Tests whether a second
# pass from the improved model compounds (vs restarting from base each round).
run_name: e29-rft-cont
run_name: e29-rft-cont
model_id: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/e28-rft-all/final
output_dir: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/e29-rft-cont
accel_config: accelerate_fsdp2_8gpu.yaml

use_lora: false
vision_strategy: frozen

data_version: 2
reasoning_frac: 0.2
rft_frac: 0.6
image_aug: true
exec_filter: true
system_prompt: detailed
reasoning_effort: medium
max_seq_len: 5120
min_pixels: 200704
max_pixels: 1179648

lr: 3.0e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: false

max_steps: 2500
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 42
