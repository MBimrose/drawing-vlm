# V4 — the real-part expected-IoU verifier retrained on the SERVED distribution.
# v3b was a LoRA on e51's weights trained on e51/e40/e45 candidates rendered with draftwright
# 0.4.0; serving now runs e55 on 0.4.23 sheets, so the verifier was scoring a distribution it
# never saw. This trains on the union of both pools:
#   rft_scored_real      94,553 candidates / 4,602 parts  (9.4% >= 0.8 — carries the positives)
#   rft_scored_real_e55  64,927 candidates / 2,142 parts  (3.1% >= 0.8 — e55 at K=32 on 0.4.23
#                        sheets, from the self-distillation pass; hardest parts only)
# Union ~159k candidates, ~6.8% positive. Base = e55 final, so the adapter matches the generator
# it is stacked on at serving time. Everything else is v3b's recipe unchanged.
run_name: v4-verifier-e55-reg
model_id: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/e55-rft-real-u5-gt-dw423/final
output_dir: /projects/illinois/eng/ece/wpk/bimrose2/drawing_vlm/runs/v4-verifier-e55-reg
accel_config: accelerate_fsdp2_8gpu.yaml

use_lora: true
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: auto
vision_strategy: frozen

data_version: 3
image_aug: true
system_prompt: detailed
trace_style: think
reasoning_effort: medium
max_seq_len: 4096
min_pixels: 200704
max_pixels: 1179648

lr: 1.0e-4
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
gradient_checkpointing: false

max_steps: 2500
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 256
eval_n_batches: 32
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 42
