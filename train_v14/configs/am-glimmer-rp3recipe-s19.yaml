# 2026-10-28: serv-19 copy (4 B300, 288 GB each). The 8-H200 run on serv-05 OOMed on rank 4 at step ~155 (133.7 GB allocated,
# 150 GB cards). Same recipe and effective batch 64 = 4 ranks x 16 accum; GPUs 4-7 (0-3 run Glimmer GRPO).
# Glimmer visual repairer (2026-10-27, user: American-VLM results table, "FFT + 8 Candidate Vote + Visual Repair" row).
# The rp3 recipe (as FNRP for Flash-Next): continued full fine-tune FROM the stage-1 generator (Glimmer e55-recipe
# final), 300 steps at lr 2e-6, warmup 5%, cosine -> 10%, effective batch 64 (8 ranks x 8 accum), the e55 data recipe with
# the RFT tier replaced by rft_mix_rp3 (strict90 base + union5 x5 + the four repair tiers at ~1/3 of draws; resolved copy
# of serv-19's symlink map), reasoning 0.2 / RFT 0.6, image aug, exec filter, seed 43. Repair rows carry two sheets
# (target + the failed program's render, ~3.1k image tokens each) -> seq 10240, answer-only logits.
# Launch on serv-05: CFG=am-glimmer-rp3recipe with DRAWING_VLM_RFT_SHARDS=/srv/scratch/bimrose2/rft_mix_rp3.
run_name: am-glimmer-rp3recipe
model_id: /srv/scratch/bimrose2/amvlm/runs/am-glimmer-30b-e55recipe/final
output_dir: /srv/scratch/bimrose2/amvlm/runs/am-glimmer-rp3recipe
accel_config: accelerate_fsdp2_4gpu_glimmer.yaml

use_lora: false
vision_strategy: frozen

data_version: 2
reasoning_frac: 0.2
rft_frac: 0.6
image_aug: true
exec_filter: true
system_prompt: detailed
reasoning_effort: medium
max_seq_len: 10240
answer_logits_only: true
processor_kwargs: {}   # Glimmer's default max_image_tokens 4096 (28-px tokens): a 1920x1280 sheet at native resolution (~3.1k tokens)

lr: 2.0e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.05
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: false

max_steps: 300
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 43
