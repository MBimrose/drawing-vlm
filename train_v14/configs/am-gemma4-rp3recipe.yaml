# Gemma 4 visual repairer (2026-10-28, American-VLM table, Gemma column): the rp3 recipe exactly as am-glimmer-rp3recipe.yaml
# (continued full FT from the stage-1 generator, 300 steps at lr 2e-6, warmup 5%, cosine -> 10%, effective batch 64 =
# 8 ranks x 8 accum, e55 data with the RFT tier = rft_mix_rp3, reasoning 0.2 / RFT 0.6, seed 43). Start = the Gemma FT's
# final_vllm (final + the base's layer_scalar / std buffers, which the FSDP2 save drops). Repair rows carry two sheets at
# ~1.1k Gemma image tokens each -> seq 7168. Launch with DRAWING_VLM_RFT_SHARDS=/srv/scratch/bimrose2/rft_mix_rp3; its
# final needs geom/fix_gemma4_final.py before vLLM.
run_name: am-gemma4-rp3recipe
model_id: /srv/scratch/bimrose2/amvlm/runs/am-gemma4-31b-e55recipe/final_vllm
output_dir: /srv/scratch/bimrose2/amvlm/runs/am-gemma4-rp3recipe
accel_config: accelerate_fsdp2_8gpu_gemma4.yaml

use_lora: false
vision_strategy: frozen
# rank-0 loading (fsdp_cpu_ram_efficient_loading) crashes on persistent buffers, and Gemma 4's 62 (layer_scalar x 60,
# vision std_bias / std_scale) are checkpoint values: demote them, then broadcast rank 0's copies before step 1.
demote_persistent_buffers: true
broadcast_buffers: true

data_version: 2
reasoning_frac: 0.2
rft_frac: 0.6
image_aug: true
exec_filter: true
system_prompt: detailed
reasoning_effort: medium
max_seq_len: 7168
# 2026-10-27: OOM at step ~1,248 in backward of the full-length 262k-vocab logits (129.7 GB allocated): lm_head runs
# only where a supervised label follows (collate_v14.answer_positions). Same loss; resumed from checkpoint-1000.
answer_logits_only: true
processor_kwargs: {max_soft_tokens: 1120}   # Gemma 4's top visual budget: a 1920x1280 sheet at native resolution (~1,070 tokens)

lr: 2.0e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.05
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: false

max_steps: 300
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 43
