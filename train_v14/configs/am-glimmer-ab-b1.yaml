# Kimi-trace A/B (2026-10-29), round 1 of 2: continues am-glimmer-ab-b0's final for 2,500 steps (4,000 in all, as the
# Glimmer FFT) on the e55 mix with the arm's OWN verified samples as the 60% RFT tier (DRAWING_VLM_RFT_SHARDS =
# amvlm/ab/tier_b/mix: own synthetic x1 + own real x5 + ABC ground-truth code x8, geom/ab_pack_tier.py).
# Arm B: no reasoning tier; plain 40%.
run_name: am-glimmer-ab-b1
model_id: /srv/scratch/bimrose2/amvlm/runs/am-glimmer-ab-b0/final
output_dir: /srv/scratch/bimrose2/amvlm/runs/am-glimmer-ab-b1
accel_config: accelerate_fsdp2_8gpu_glimmer.yaml

use_lora: false
vision_strategy: frozen

data_version: 2
reasoning_frac: 0.0
rft_frac: 0.6
image_aug: true
exec_filter: true
system_prompt: detailed
reasoning_effort: medium
max_seq_len: 6144
processor_kwargs: {}   # Glimmer's default max_image_tokens 4096 (28-px tokens): a 1920x1280 sheet at native resolution (~3.1k tokens)

lr: 6.0e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.03
weight_decay: 0.0
attention_dropout: 0.0

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: false

max_steps: 2500
save_strategy: "no"
save_total_limit: 1
save_only_model: false
save_best: true
save_final: true
logging_steps: 10
eval_every: 250
eval_n: 128
eval_n_batches: 16
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
seed: 43
